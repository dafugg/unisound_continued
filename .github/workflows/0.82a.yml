name: 0.82a byte-identical

# Builds the 0.82a branch in 86Box under FreeDOS 1.4 (build.yml) and fails unless UNISOUND.COM
# matches the original v0.82a's hash (UNISOUND.SHA256). The 0.82a branch runs the same check on
# its own pushes and PRs (its 0.82a.yml calls build.yml here); this copy runs it on every push to
# main, daily and on demand, so a CI change on main can't silently break it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 0.82a build
    uses: ./.github/workflows/build.yml
    with:
      ref: '0.82a'
      check_hash: true
      skip_format: true
