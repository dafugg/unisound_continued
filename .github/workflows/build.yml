name: FreeDOS build

# Builds UNISOUND.COM with Turbo C++ 3.0 (tools/build.sh) in 86Box under FreeDOS 1.4.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_format:
        description: Skip the clang-format check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    # Inputs are unset (null) on push and pull_request, and expressions treat null like false,
    # so the input has to be "skip", which only a caller sets.
    if: ${{ !inputs.skip_format }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          command -v clang-format-18 || { sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18; }
          git ls-files 'src/*.C' 'tools/dos/*.C' | xargs clang-format-18 --dry-run -Werror

  build:
    name: UNISOUND.COM
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-86box
      # Turbo C++ 3.00 from joncloud/dos-build-action; its files are byte-identical to the TC 3.0
      # the original UNISOUND.COM was matched with.
      - uses: actions/checkout@v4
        with:
          repository: joncloud/dos-build-action
          ref: 76b53e600a47530c209e5de8344cef9a94c43515
          path: dos-build-action
          sparse-checkout: programs/turbo-c++/3.00
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
          BOX86_BINARY: /opt/86box/bin/86Box
          BOX86_ROMS: /opt/86box/roms
          BOXPY: /opt/86box/venv/bin/python
          BOX86MCP: unused
          UNIVM: vm
        run: |
          /opt/86box/venv/bin/python -I tools/freedos-vm.py /opt/86box/FD14LITE.img vm \
            "dos-build-action/programs/turbo-c++/3.00"
          sh tools/build.sh --no-hash
          sha256sum build/out/UNISOUND.COM
      - uses: actions/upload-artifact@v4
        with:
          name: UNISOUND.COM
          path: build/out/UNISOUND.COM
