name: FreeDOS smoke test

# Builds UNISOUND.COM (build.yml), then runs it in 86Box under FreeDOS 1.4 (on the 486SP3C and the
# 486-VIP-IO2) on a few emulated sound cards and checks the output (tools/smoke.py).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: FreeDOS build
    uses: ./.github/workflows/build.yml
    with:
      skip_format: true

  smoke:
    name: 86Box smoke test
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-86box
      - uses: actions/download-artifact@v8
        with:
          name: UNISOUND.COM
          path: com
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BOX86_BINARY: /opt/86box/bin/86Box
          BOX86_ROMS: /opt/86box/roms
        run: |
          /opt/86box/venv/bin/python -I tools/freedos-vm.py /opt/86box/FD14LITE.img vm
          /opt/86box/venv/bin/python -I tools/freedos-vm.py /opt/86box/FD14LITE.img vm2 \
            --machine 486vipio2 --nvr tools/nvr/486vipio2.nvr
          /opt/86box/venv/bin/python -I tools/smoke.py com/UNISOUND.COM smoke-out pnp=vm pnp2=vm2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-output
          path: smoke-out
